<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設備掃描借還</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            padding: 15px;
            background-color: #f8f9fa;
            margin: 0;
            color: #333;
        }
        .user-bar {
            max-width: 420px;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 8px 14px;
            border-radius: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            font-size: 14px;
            font-weight: 600;
        }
        .btn-logout {
            background: #e9ecef;
            border: none;
            padding: 5px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
            color: #495057;
            font-weight: 600;
        }
        .btn-logout:hover { background: #dee2e6; }
        h2 { margin: 5px 0 15px; }

        .mode-container {
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        .mode-btn {
            flex: 1;
            max-width: 160px;
            padding: 11px 16px;
            font-size: 15px;
            border: 2px solid #007bff;
            border-radius: 25px;
            background-color: white;
            color: #007bff;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .mode-btn.active-borrow {
            background-color: #007bff;
            color: white;
            box-shadow: 0 3px 8px rgba(0, 123, 255, 0.3);
        }
        .mode-btn.active-return {
            background-color: #28a745;
            border-color: #28a745;
            color: white;
            box-shadow: 0 3px 8px rgba(40, 167, 69, 0.3);
        }

        .query-link {
            display: inline-block;
            margin-bottom: 12px;
            padding: 6px 16px;
            font-size: 13px;
            border: 1px solid #ced4da;
            border-radius: 20px;
            background-color: #ffffff;
            color: #495057;
            text-decoration: none;
        }

        #camera-select {
            margin-bottom: 12px;
            padding: 8px;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid #ced4da;
            width: 100%;
            max-width: 420px;
            background-color: white;
        }

        #reader {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
        }

        #result-box {
            margin: 15px auto 0;
            max-width: 420px;
            padding: 12px 14px;
            border-radius: 8px;
            background: #ffffff;
            border: 1px solid #e9ecef;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-size: 14px;
            line-height: 1.5;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: pre-wrap;
            font-weight: 600;
            color: #495057;
        }
        .status-idle { color: #6c757d; }
        .status-loading { color: #007bff; }
        .status-success { color: #1e7e34; background-color: #d4edda !important; border-color: #c3e6cb !important; }
        .status-error { color: #bd2130; background-color: #f8d7da !important; border-color: #f5c6cb !important; }
    </style>
</head>
<body>

    <div class="user-bar">
        <span id="user-display">👤 載入身分中...</span>
        <button class="btn-logout" onclick="logout()">登出</button>
    </div>

    <h2>📷 設備掃描借還</h2>

    <div class="mode-container">
        <button id="btn-borrow" class="mode-btn active-borrow" onclick="setMode('borrow')">📤 借用模式</button>
        <button id="btn-return" class="mode-btn" onclick="setMode('return')">📥 歸還模式</button>
    </div>

    <div>
        <a href="list.html" class="query-link">📋 查看目前借出清單</a>
    </div>

    <select id="camera-select"></select>
    <div id="reader"></div>
    <div id="result-box" class="status-idle">相機啟動中，請稍候...</div>

    <script>
        // ★★★ 請確認是你的 GAS Web App URL ★★★
        const API_URL = "https://script.google.com/macros/s/AKfycbzkyhOuqf9guo10dAMUtgTUFRvRhQ1PMvTVBwvDMMEE_xNr5MUSLPbzdG--RPVicFt-/exec";

        let currentUser = null;
        let isProcessing = false;
        let currentMode = "borrow";
        const resultBox = document.getElementById('result-box');
        const cameraSelect = document.getElementById('camera-select');
        const html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };

        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem("EQUIP_USER");
            if (!savedUser) {
                alert("尚未登入，請先輸入身分！");
                window.location.href = "index.html";
                return;
            }
            currentUser = JSON.parse(savedUser);
            document.getElementById('user-display').innerText = `👤 ${currentUser.name} (${currentUser.id})`;
        });

        function logout() {
            localStorage.removeItem("EQUIP_USER");
            window.location.href = "index.html";
        }

        function setMode(mode) {
            currentMode = mode;
            const btnBorrow = document.getElementById('btn-borrow');
            const btnReturn = document.getElementById('btn-return');

            if (mode === 'borrow') {
                btnBorrow.className = "mode-btn active-borrow";
                btnReturn.className = "mode-btn";
            } else {
                btnBorrow.className = "mode-btn";
                btnReturn.className = "mode-btn active-return";
            }
        }

        function setResult(message, statusClass) {
            resultBox.className = statusClass;
            resultBox.innerText = message;
        }

        function onScanSuccess(decodedText) {
            if (isProcessing) return;
            isProcessing = true;

            if (navigator.vibrate) navigator.vibrate(80);

            let parsedId = decodedText;
            if (parsedId.includes("text=")) {
                parsedId = parsedId.split("text=")[1].split("&")[0];
            } else if (parsedId.includes("id=")) {
                parsedId = parsedId.split("id=")[1].split("&")[0];
            }
            parsedId = parsedId.trim();

            const actionLabel = currentMode === "borrow" ? "借用" : "歸還";
            setResult(`讀取設備編號：${parsedId}\n正在處理【${actionLabel}】...`, "status-loading");

            const requestUrl = `${API_URL}?id=${encodeURIComponent(parsedId)}&action=${currentMode}&user_id=${encodeURIComponent(currentUser.id)}`;

            fetch(requestUrl)
                .then(res => res.json())
                .then(data => {
                    setResult(data.message, data.success ? "status-success" : "status-error");
                    setTimeout(() => {
                        isProcessing = false;
                        setResult("請對準下一個 QR Code 進行掃描...", "status-idle");
                    }, 3500);
                })
                .catch(err => {
                    setResult("連線失敗，請檢查網路或 Apps Script 權限！", "status-error");
                    setTimeout(() => {
                        isProcessing = false;
                        setResult("請對準 QR Code 進行掃描...", "status-idle");
                    }, 3500);
                });
        }

        function startCamera(cameraId) {
            html5QrCode.start(cameraId, config, onScanSuccess)
                .then(() => {
                    setResult("請對準 QR Code 進行掃描...", "status-idle");
                })
                .catch(err => {
                    setResult("相機啟動失敗，請確認已授權攝影機權限。", "status-error");
                });
        }

        Html5Qrcode.getCameras().then(devices => {
            if (devices && devices.length) {
                let defaultCameraId = devices[0].id;
                cameraSelect.innerHTML = "";

                devices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.id;
                    option.text = device.label || `相機 ${index + 1}`;
                    cameraSelect.appendChild(option);

                    if (/back|rear|environment/i.test(device.label)) {
                        defaultCameraId = device.id;
                    }
                });

                cameraSelect.value = defaultCameraId;
                startCamera(defaultCameraId);

                cameraSelect.addEventListener('change', () => {
                    html5QrCode.stop().then(() => {
                        startCamera(cameraSelect.value);
                    });
                });
            } else {
                setResult("未偵測到可用相機裝置。", "status-error");
            }
        }).catch(err => {
            setResult("無法讀取相機，請使用 HTTPS 連線並開放權限。", "status-error");
        });
    </script>
</body>
</html>
