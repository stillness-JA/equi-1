<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設備管理系統 - 登入</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .login-card {
            background: white;
            padding: 32px 26px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        h2 { margin: 0 0 8px; color: #333; }
        p { color: #666; font-size: 14px; margin: 0 0 25px; }
        .input-group { margin-bottom: 18px; text-align: left; }
        .input-group label {
            display: block;
            font-size: 14px;
            color: #495057;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .input-box {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-box:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-submit:hover { background-color: #0056b3; }
        .btn-submit:disabled { background-color: #adb5bd; cursor: not-allowed; }
        #login-msg {
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
            font-weight: 500;
            line-height: 1.4;
        }
        .msg-error { color: #dc3545; }
        .msg-loading { color: #007bff; }
        .msg-success { color: #28a745; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>🏫 設備借還系統</h2>
    <p>請輸入學號與密碼進行身分驗證</p>

    <div class="input-group">
        <label for="user-id">學號 / 員工編號</label>
        <input type="text" id="user-id" class="input-box" placeholder="請輸入學號或編號" autofocus>
    </div>

    <div class="input-group">
        <label for="user-pwd">密碼</label>
        <input type="password" id="user-pwd" class="input-box" placeholder="請輸入密碼">
    </div>

    <button type="button" id="btn-login" class="btn-submit">登入系統</button>
    <div id="login-msg"></div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzkyhOuqf9guo10dAMUtgTUFRvRhQ1PMvTVBwvDMMEE_xNr5MUSLPbzdG--RPVicFt-/exec";

    document.addEventListener('DOMContentLoaded', function() {
        const savedUser = localStorage.getItem("EQUIP_USER");
        if (savedUser) {
            window.location.href = "scan.html";
            return;
        }

        const userIdInput = document.getElementById('user-id');
        const userPwdInput = document.getElementById('user-pwd');
        const loginBtn = document.getElementById('btn-login');
        const msgDiv = document.getElementById('login-msg');

        function executeLogin() {
            const userId = userIdInput.value.trim();
            const password = userPwdInput.value.trim();

            if (!userId || !password) {
                msgDiv.className = "msg-error";
                msgDiv.innerText = "請完整輸入學號與密碼！";
                return;
            }

            loginBtn.disabled = true;
            msgDiv.className = "msg-loading";
            msgDiv.innerText = "驗證帳號與密碼中...";

            const loginUrl = API_URL + "?action=login&user_id=" + encodeURIComponent(userId) + "&password=" + encodeURIComponent(password);

            fetch(loginUrl)
                .then(function(res) { return res.json(); })
                .then(function(res) {
                    if (res.success && res.user) {
                        localStorage.setItem("EQUIP_USER", JSON.stringify(res.user));
                        msgDiv.className = "msg-success";
                        msgDiv.innerText = "登入成功！歡迎 " + res.user.name + "，正在跳轉...";
                        setTimeout(function() {
                            window.location.href = "scan.html";
                        }, 700);
                    } else {
                        loginBtn.disabled = false;
                        msgDiv.className = "msg-error";
                        msgDiv.innerText = res.message || "登入失敗，請確認帳號密碼。";
                    }
                })
                .catch(function(err) {
                    console.error("Login Error:", err);
                    loginBtn.disabled = false;
                    msgDiv.className = "msg-error";
                    msgDiv.innerText = "連線失敗，請檢查網路或系統設定。";
                });
        }

        loginBtn.addEventListener('click', executeLogin);

        userIdInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                userPwdInput.focus();
            }
        });

        userPwdInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                executeLogin();
            }
        });
    });
</script>
</body>
</html>
