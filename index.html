<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzkyhOuqf9guo10dAMUtgTUFRvRhQ1PMvTVBwvDMMEE_xNr5MUSLPbzdG--RPVicFt-/exec";

    window.addEventListener('DOMContentLoaded', () => {
        const savedUser = localStorage.getItem("EQUIP_USER");
        if (savedUser) {
            window.location.href = "scan.html";
        }
    });

    document.getElementById('user-id').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('user-pwd').focus();
        }
    });

    document.getElementById('user-pwd').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            handleLogin();
        }
    });

    function handleLogin() {
        const userId = document.getElementById('user-id').value.trim();
        const password = document.getElementById('user-pwd').value.trim();
        const msgDiv = document.getElementById('login-msg');
        const btn = document.getElementById('btn-login');

        if (!userId || !password) {
            msgDiv.className = "msg-error";
            msgDiv.innerText = "請完整輸入學號與密碼！";
            return;
        }

        btn.disabled = true;
        msgDiv.className = "msg-loading";
        msgDiv.innerText = "驗證帳號與密碼中...";

        const loginUrl = `${API_URL}?action=login&user_id=${encodeURIComponent(userId)}&password=${encodeURIComponent(password)}`;

        fetch(loginUrl)
            .then(res => res.json())
            .then(res => {
                if (res.success && res.user) {
                    localStorage.setItem("EQUIP_USER", JSON.stringify(res.user));
                    msgDiv.className = "msg-success";
                    msgDiv.innerText = `登入成功！歡迎 ${res.user.name}，正在跳轉...`;
                    setTimeout(() => {
                        window.location.href = "scan.html";
                    }, 700);
                } else {
                    btn.disabled = false;
                    msgDiv.className = "msg-error";
                    msgDiv.innerText = res.message || "登入失敗，請確認帳號密碼。";
                }
            })
            .catch(err => {
                console.error("Login Error:", err);
                btn.disabled = false;
                msgDiv.className = "msg-error";
                msgDiv.innerText = "連線失敗，請檢查網路或系統設定。";
            });
    }
</script>
</body>
</html>
