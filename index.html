<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設備管理系統 - 登入</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .login-card {
            background: white;
            padding: 32px 26px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        h2 {
            margin: 0 0 8px;
            color: #333;
        }
        p {
            color: #666;
            font-size: 14px;
            margin: 0 0 25px;
        }
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            color: #495057;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .input-box {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-box:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
        .btn-submit:disabled {
            background-color: #adb5bd;
            cursor: not-allowed;
        }
        #login-msg {
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
            font-weight: 500;
            line-height: 1.4;
        }
        .msg-error { color: #dc3545; }
        .msg-loading { color: #007bff; }
        .msg-success { color: #28a745; }
        .footer-link {
            margin-top: 25px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .footer-link a {
            color: #6c757d;
            font-size: 13px;
            text-decoration: none;
        }
        .footer-link a:hover {
            color: #007bff;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>🏫 設備借還系統</h2>
    <p>請輸入學號與密碼進行身分驗證</p>

    <div class="input-group">
        <label for="user-id">學號 / 員工編號</label>
        <input type="text" id="user-id" class="input-box" placeholder="請輸入學號或編號" autofocus>
    </div>

    <div class="input-group">
        <label for="user-pwd">密碼</label>
        <input type="password" id="user-pwd" class="input-box" placeholder="請輸入密碼">
    </div>

    <button id="btn-login" class="btn-submit" onclick="handleLogin()">登入系統</button>
    <div id="login-msg"></div>

    <div class="footer-link">
        <a href="list.html">📋 檢視目前借出清單</a>
    </div>
</div>

<script>
    // ★★★ GAS Web App URL ★★★
    const API_URL = "https://script.google.com/macros/s/AKfycbzmBXl82KlfLR3GBtRhKv8GQ8b7BEOcDs-C1ywubNC5yYIlQcb0UYOFg2fEmSBxZt4/exec";

    // 若瀏覽器已有登入紀錄，自動跳轉至掃描頁面
    window.addEventListener('DOMContentLoaded', () => {
        const savedUser = localStorage.getItem("EQUIP_USER");
        if (savedUser) {
            window.location.href = "scan.html";
        }
    });

    // 帳號欄按 Enter 跳至密碼欄，密碼欄按 Enter 送出登入
    document.getElementById('user-id').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('user-pwd').focus();
        }
    });
    document.getElementById('user-pwd').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            handleLogin();
        }
    });

            msgDiv.className = "msg-error";
